# git-cliff 配置：从 Conventional Commits 生成中文发布说明与 CHANGELOG。
# 提交类型 → 分组映射；发布类提交（chore: release / chore: 发布）不进入变更记录。

[changelog]
header = """
# 更新日志

所有显著变更都记录在本文件中，格式参照 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)。

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}（{{ timestamp | date(format="%Y-%m-%d") }}）
{% else %}\
## 未发布
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group }}
{% for commit in commits %}\
- {{ commit.message | upper_first | split(pat="\n") | first }}
{% endfor %}\
{% endfor %}
{% if previous.version %}\
**完整对比**: [{{ previous.version }}...{{ version }}](https://github.com/lvtian-bot/qingwu/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
footer = """
<!-- 本文件由 git-cliff 依据 Conventional Commits 自动生成，请勿手工编辑 -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^(feat|fix|chore)\\(release|发布\\)|^feat|fix|chore: (release|发布|Release)", skip = true },
  { message = "^feat", group = "✨ 新增" },
  { message = "^fix", group = "🐛 修复" },
  { message = "^perf", group = "⚡ 性能" },
  { message = "^refactor", group = "♻️ 重构" },
  { message = "^docs", group = "📝 文档" },
  { message = "^test", group = "🧪 测试" },
  { message = "^build|^ci", group = "🏗️ 构建与集成" },
  { message = "^chore", group = "⚙️ 工程维护" },
  { message = "^Revert", group = "⏪ 回退" },
  { message = ".*", group = "⚙️ 工程维护" },
]
