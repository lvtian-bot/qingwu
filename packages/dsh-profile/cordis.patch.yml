# 应用默认层位于 dsh-base 之后、用户配置之前，由 dsh 自行组合。
- id: web
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api

# Exa 搜索提供方：基础与网页 bundle 均未声明该插件，必须以顶层 insert 加入清单
# （无 insert 的条目只按 id 覆盖已有项，找不到时会被跳过）。密钥经用户环境层以
# EXA_API_KEY 供给，不在此写 config，避免密钥进入插件配置与设置回显。
- insert:
    - id: web-search-exa
      name: '@deepseek-ai/dsh-web-search-exa'
