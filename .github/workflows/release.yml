name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: npm run check

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Install git-cliff
        run: |
          curl -sSL -o cliff.zip https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-pc-windows-msvc.zip
          tar -xf cliff.zip
          Move-Item git-cliff-2.13.1/git-cliff.exe "$env:RUNNER_TEMP\git-cliff.exe"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP"

      - name: Generate release notes and changelog
        run: |
          git-cliff.exe --latest --strip all -o release-notes.md
          git-cliff.exe -o CHANGELOG.md

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          body_path: release-notes.md

      - name: Commit updated CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if (-Not (git diff --cached --quiet)) {
            git commit -m "chore: 发布后更新 CHANGELOG 至 ${{ github.ref_name }}"
            git push origin HEAD:master
          }
